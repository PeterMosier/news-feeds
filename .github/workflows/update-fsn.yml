name: Update FSN Feed Hourly

on:
  schedule:
    - cron: "20 * * * *"   # every hour
  workflow_dispatch:       # manual trigger

jobs:
  update-fsn:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1   # latest release, Node 24‑ready

      - name: Test FSN URL
        run: |
          curl -I \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            "https://www.fsnradionews.com/FSNNews/FSNWorldNews.mp3"
      
      - name: Download latest FSN bulletin
        run: |
          curl -L \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" \
            -H "Accept: audio/mpeg,*/*" \
            "https://www.fsnradionews.com/FSNNews/FSNWorldNews.mp3" \
            -o audio/fsn-latest.mp3
            
      - name: Verify MP3
        run: |
          file audio/fsn-latest.mp3
      
          if ! file audio/fsn-latest.mp3 | grep -q "Audio"; then
            echo "ERROR: Download is not an MP3"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7.0.0   # latest release, Node 24‑ready
        with:
          python-version: "3.x"

      - name: Run update script
        run: |
          python scripts/update-fsn.py

      - name: Sync with remote
        run: |
          git fetch origin main
          git reset --soft origin/main

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add feeds/fsn-world-news.xml
          git add audio/fsn-latest.mp3
          git commit -m "Auto-update FSN feed" || echo "No changes to commit"
          git push origin main
