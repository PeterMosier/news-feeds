name: Update FSN Feed Hourly

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # manual trigger

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.1.7   # latest release, Node 24‑ready

      - name: Set up Python
        uses: actions/setup-python@v5.1.0   # latest release, Node 24‑ready
        with:
          python-version: "3.x"

      - name: Run update script
        run: |
          python scripts/update-fsn.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add feeds/fsn-world-news.xml
          git commit -m "Auto-update FSN feed" || echo "No changes to commit"
          git push origin main
